<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List App</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            /* padding: 20px; */
            margin: 0 auto;

        }
        .form-section, .list-section {
            /* flex: 1; */
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(243, 241, 241, 0.1);
        }
        .form-section {
            flex: 1;
        }
        .list-section {
            flex: 2;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border-bottom: 1px solid #ddd;
            padding: 7px;
            text-align: left;
        }
        th {
            background-color: #f6f7f8;
        }
         h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        h2 {
            margin-bottom: 20px;
            color: #555;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;

        }
        input, select {
            width: 100%;
            padding: 8px;
            /* box-sizing: border-box; */
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color:  #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        /* .action-buttons {
            display: flex;
            gap: 5px;
        } */
        .btn-edit {
            background-color: #28a745;
            /* size: 12px; */
              /* color: #28a745; */
            
        }

        .btn-delete {
            background-color: #dc3545;
         /* color: #dc3545; */
            /* size: 12; */
            
        }

        /* .success {
           color: green;
           padding: 10px;
           margin-bottom: 10px;
        }

        .error {
           color: red;
           padding: 10px;
           margin-bottom: 10px;
        } */
    </style>
</head>
<body>
    <div class="container">
        <!-- Left: Form Section -->
        <div class="form-section">
            <h2>User Information</h2>
            <form id="userForm">
                <input type="hidden" id="userId" name="id">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter Name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter Email" required>
                </div>
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" placeholder="Enter Age"required>
                </div>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <button type="submit" id="submitBtn">Submit</button>
                <button type="button" id="cancelBtn" style="display:none;" class="hidden" >Cancel</button>
            </form>
        </div>

        <!-- Right: List Section -->
        <div class="list-section">
            <h2>User List</h2>
            <div id="userList">
                <!-- User list will be loaded here via AJAX  -->
            </div>
        </div>
    </div>

    <script>
        // Load user list on page load
        document.addEventListener('DOMContentLoaded', loadUserList);
        
        // Form submission handler
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();
            submitUser();
        });
        
        // Cancel button handler
        document.getElementById('cancelBtn').addEventListener('click', resetForm);
        
        function loadUserList() {
            fetch('list.php')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('userList').innerHTML = data;
                });
        }
        
        function submitUser() {
            const formData = new FormData(document.getElementById('userForm'));
            const userId = document.getElementById('userId').value;
            const url = userId ? 'ajax/edit.php' : 'ajax/submit.php';
            
            fetch(url, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    resetForm();
                    loadUserList();
                } else {
                    alert('Error: ' + data.message);
                }
            });
        }
        
        function editUser(id) {
            fetch('ajax/edit.php?id=' + id)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('userId').value = data.user.id;
                        document.getElementById('name').value = data.user.name;
                        document.getElementById('email').value = data.user.email;
                        document.getElementById('age').value = data.user.age;
                        document.getElementById('gender').value = data.user.gender;
                        document.getElementById('submitBtn').textContent = 'Update User';
                        document.getElementById('cancelBtn').classList.remove('hidden');
                    }
                });
        }
        
        function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                const formData = new FormData();
                formData.append('id', id);
                
                fetch('ajax/delete.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        loadUserList();
                    } else {
                        alert('Error: ' + data.message);
                    }
                });
            }
        }
        
        function resetForm() {
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('submitBtn').textContent = 'Submit';
            document.getElementById('cancelBtn').classList.add('hidden');
        }
    </script>
</body>
</html>
